  <text x="604" y="137" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#027A48">210,000,000 ₫</text>
  
  <!-- Row 2 (Active editing by collaborator) -->
  <rect x="0" y="150" width="50" height="36" fill="#F9FAFB" stroke="#EAECF0"/>
  <text x="20" y="173" font-family="system-ui, sans-serif" font-size="12" fill="#667085">2</text>
