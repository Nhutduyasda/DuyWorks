  <rect x="230" y="186" width="180" height="36" fill="#FFFFFF" stroke="#EAECF0"/>
  <text x="244" y="209" font-family="system-ui, sans-serif" font-size="12" fill="#344054">35,000,000 ₫</text>
  <rect x="410" y="186" width="180" height="36" fill="#FFFFFF" stroke="#EAECF0"/>
  <text x="424" y="209" font-family="system-ui, sans-serif" font-size="12" fill="#344054">78,000,000 ₫</text>
  <rect x="590" y="186" width="210" height="36" fill="#FFFFFF" stroke="#EAECF0"/>
  <text x="604" y="209" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#027A48">95,000,000 ₫</text>
  
  <!-- Summary Box -->
  <g transform="translate(36, 320)">
    <rect width="728" height="130" rx="10" fill="#F9FAFB" stroke="#EAECF0"/>
    <text x="24" y="34" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#101828">Đặc điểm kỹ thuật chính</text>
    <text x="24" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#475467">• Đồng bộ dữ liệu ô tức thời với WebSockets và Conflict Resolution</text>
    <text x="24" y="86" font-family="system-ui, sans-serif" font-size="12" fill="#475467">• Phân quyền khóa cột tài chính và quản lý lịch sử sửa đổi chi tiết theo từng người dùng</text>
    <text x="24" y="110" font-family="system-ui, sans-serif" font-size="12" fill="#475467">• Hỗ trợ xuất dữ liệu sang chuẩn Excel (.xlsx) nguyên bản và tích hợp API doanh nghiệp</text>
