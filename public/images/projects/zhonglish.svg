<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" rx="12" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="799" height="499" rx="11.5" stroke="#EAECF0"/>
  
  <!-- Window Header -->
  <rect width="800" height="42" rx="12 12 0 0" fill="#F9FAFB"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#EAECF0"/>
  <circle cx="24" cy="21" r="5" fill="#F04438"/>
  <circle cx="40" cy="21" r="5" fill="#F79009"/>
  <circle cx="56" cy="21" r="5" fill="#12B76A"/>
  <text x="76" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#344054">Zhonglish — Learning App (HSK 3 - Chuyên Đề Giao Tiếp)</text>
  
  <!-- App Body -->
  <rect x="0" y="42" width="800" height="458" fill="#F9FAFB"/>
  
  <!-- Left Side: Interactive Vocabulary Card -->
  <g transform="translate(36, 68)">
    <rect width="420" height="390" rx="12" fill="#FFFFFF" stroke="#EAECF0"/>
    
    <!-- Top badge -->
    <rect x="24" y="24" width="80" height="24" rx="6" fill="#EEF2FF"/>
    <text x="36" y="40" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#465FFF">Từ vựng #42</text>
    
    <!-- Hanzi Character -->
    <text x="210" y="160" font-family="'Noto Sans SC', system-ui, sans-serif" font-size="72" font-weight="700" fill="#101828" text-anchor="middle">发展</text>
    <text x="210" y="200" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#465FFF" text-anchor="middle">fāzhǎn</text>
    <text x="210" y="235" font-family="system-ui, sans-serif" font-size="15" fill="#475467" text-anchor="middle">Phát triển (Động từ / Danh từ)</text>
    
    <!-- Example sentence box -->
    <rect x="24" y="265" width="372" height="60" rx="8" fill="#F9FAFB" stroke="#EAECF0"/>
    <text x="40" y="290" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#344054">经济快速发展。(Kinh tế phát triển nhanh chóng.)</text>
    <text x="40" y="310" font-family="system-ui, sans-serif" font-size="11" fill="#667085">Nhấn để nghe phát âm giọng chuẩn Bắc Kinh</text>
    
    <!-- Action buttons -->
    <rect x="24" y="340" width="176" height="34" rx="8" fill="#F2F4F7"/>
    <text x="76" y="362" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#344054">Xem lại sau</text>
    
    <rect x="220" y="340" width="176" height="34" rx="8" fill="#465FFF"/>
    <text x="270" y="362" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Đã thuộc từ này ✓</text>
  </g>
  
  <!-- Right Side: Stats & Progression -->
  <g transform="translate(480, 68)">
    <!-- Streak and XP widget -->
    <rect width="284" height="120" rx="12" fill="#FFFFFF" stroke="#EAECF0"/>
    <text x="20" y="34" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#101828">Mục tiêu học hôm nay</text>
    <text x="20" y="68" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#101828">18 / 20 Từ</text>
    
    <rect x="20" y="86" width="244" height="8" rx="4" fill="#F2F4F7"/>
    <rect x="20" y="86" width="219" height="8" rx="4" fill="#12B76A"/>
    <text x="200" y="108" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#027A48">90% hoàn thành</text>
    
    <!-- XP & Streak badges -->
    <rect y="136" width="284" height="120" rx="12" fill="#FFFFFF" stroke="#EAECF0"/>
    <text x="20" y="168" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#101828">Thành tích &amp; Điểm XP</text>
    
    <rect x="20" y="184" width="112" height="52" rx="8" fill="#FEF3F2"/>
    <text x="32" y="204" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#B42318">Chuỗi ngày</text>
    <text x="32" y="226" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#B42318">🔥 14 ngày</text>
    
    <rect x="152" y="184" width="112" height="52" rx="8" fill="#EEF2FF"/>
    <text x="164" y="204" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#465FFF">Tổng điểm XP</text>
    <text x="164" y="226" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#465FFF">⚡ 2,450 XP</text>
    
    <!-- Backend Architecture note -->
    <rect y="272" width="284" height="186" rx="12" fill="#FFFFFF" stroke="#EAECF0"/>
    <text x="20" y="302" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#101828">Kiến trúc sản phẩm</text>
    <circle cx="28" cy="326" r="4" fill="#465FFF"/>
    <text x="40" y="330" font-family="system-ui, sans-serif" font-size="12" fill="#475467">Frontend: Next.js 15 &amp; Tailwind</text>
    <circle cx="28" cy="354" r="4" fill="#465FFF"/>
    <text x="40" y="358" font-family="system-ui, sans-serif" font-size="12" fill="#475467">Database: Supabase PostgreSQL</text>
    <circle cx="28" cy="382" r="4" fill="#465FFF"/>
    <text x="40" y="386" font-family="system-ui, sans-serif" font-size="12" fill="#475467">Auth: Supabase Row Level Security</text>
    <circle cx="28" cy="410" r="4" fill="#465FFF"/>
    <text x="40" y="414" font-family="system-ui, sans-serif" font-size="12" fill="#475467">Deployment: Vercel Edge Network</text>
  </g>
</svg>
