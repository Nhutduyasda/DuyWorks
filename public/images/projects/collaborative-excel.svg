  <text x="572" y="155" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">Tuấn Đang sửa</text>
  
  <rect x="590" y="150" width="210" height="36" fill="#FFFFFF" stroke="#EAECF0"/>
  <text x="604" y="173" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#027A48">60,000,000 ₫</text>
  
  <!-- Row 3 -->
  <rect x="0" y="186" width="50" height="36" fill="#F9FAFB" stroke="#EAECF0"/>
